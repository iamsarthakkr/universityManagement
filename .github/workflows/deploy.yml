name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      api_version:
        description: Released API version to deploy (defaults to the newest in versions.yml)
        required: false
        type: string
      frontend_version:
        description: Released frontend version to deploy (defaults to the newest in versions.yml)
        required: false
        type: string
      sha:
        description: Commit on main to take the deploy files from (defaults to the latest commit on main). It must have a successful CI run.
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify manual deploy target
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Deploy from the main branch, not ${GITHUB_REF}."
          exit 1

      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve commit and require a successful CI run
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          if ! sha=$(git rev-parse --verify --quiet "${REQUESTED_SHA:-$GITHUB_SHA}^{commit}"); then
            echo "::error::Unknown commit '${REQUESTED_SHA:-$GITHUB_SHA}'."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::Commit $sha is not on main."
            exit 1
          fi

          successful_runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" \
            --branch main --event push --status success --json databaseId --jq 'length')
          if [[ "$successful_runs" == "0" ]]; then
            echo "::error::Commit $sha has no successful CI run on main. Deploy a commit that CI verified."
            exit 1
          fi

          echo "Using deploy files from verified commit $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan release
    needs: verify
    if: >-
      !cancelled()
      && ((github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
        || (github.event_name == 'workflow_dispatch' && needs.verify.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      releases: ${{ steps.plan.outputs.releases }}
      api_version: ${{ steps.plan.outputs.api_version }}
      frontend_version: ${{ steps.plan.outputs.frontend_version }}
      deploy: ${{ steps.plan.outputs.deploy }}
    env:
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || needs.verify.outputs.sha }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Decide what to release and deploy
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          REQUESTED_API_VERSION: ${{ inputs.api_version }}
          REQUESTED_FRONTEND_VERSION: ${{ inputs.frontend_version }}
        run: |
          is_released() {
            gh release view "$1" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1
          }

          releases='[]'
          for app in api frontend; do
            case "$app" in
              api) context=server; requested=$REQUESTED_API_VERSION ;;
              frontend) context=frontend; requested=$REQUESTED_FRONTEND_VERSION ;;
            esac
            newest=$(.github/scripts/versions.sh latest "$app")

            if [[ "$MANUAL" == "true" ]]; then
              version="${requested:-$newest}"
              if ! is_released "${app}-v${version}"; then
                echo "::error::${app} ${version} has not been released, so it can't be deployed manually."
                exit 1
              fi
            else
              version=$newest
              if is_released "${app}-v${version}"; then
                echo "${app} ${version} is already released"
              else
                echo "${app} ${version} will be released"
                notes=$(yq ".${app}[-1].notes" versions.yml)
                releases=$(jq -c --arg app "$app" --arg context "$context" --arg version "$version" --arg notes "$notes" \
                  '. + [{app: $app, context: $context, version: $version, notes: $notes}]' <<< "$releases")
              fi
            fi

            echo "${app}_version=${version}" >> "$GITHUB_OUTPUT"
          done

          if [[ "$MANUAL" == "true" || "$releases" != "[]" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No new versions in versions.yml - nothing to deploy."
          fi

          echo "releases=${releases}" >> "$GITHUB_OUTPUT"
          echo "sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ matrix.app }} ${{ matrix.version }}
    needs: plan
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.releases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    env:
      IMAGE: ghcr.io/iamsarthakkr/university-management-${{ matrix.app }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
          VERSION: ${{ matrix.version }}
          NOTES: ${{ matrix.notes }}
          COMMIT_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          gh release create "${APP}-v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$COMMIT_SHA" \
            --title "${APP} ${VERSION}" --notes "${NOTES}

          Image: \`${IMAGE}:${VERSION}\`"

  deploy:
    name: Deploy to VPS
    needs: [plan, release]
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.deploy == 'true'
      && (needs.release.result == 'success'
        || (needs.release.result == 'skipped' && needs.plan.outputs.releases == '[]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      API_VERSION: ${{ needs.plan.outputs.api_version }}
      FRONTEND_VERSION: ${{ needs.plan.outputs.frontend_version }}
    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: deploy

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'SSH_CONFIG'
          Host *
            IdentityFile ~/.ssh/deploy_key
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          SSH_CONFIG

      - name: Upload deploy files
        run: scp -p deploy/compose.yml deploy/deploy.sh "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"

      - name: Deploy api ${{ env.API_VERSION }} and frontend ${{ env.FRONTEND_VERSION }}
        run: |
          remote_command=$(printf 'API_IMAGE_TAG=%q FRONTEND_IMAGE_TAG=%q %q' \
            "$API_VERSION" "$FRONTEND_VERSION" "$VPS_APP_DIR/deploy.sh")
          # shellcheck disable=SC2029
          ssh "$VPS_USER@$VPS_HOST" "$remote_command"
