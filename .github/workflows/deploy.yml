name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Build & publish ${{ matrix.name }} image
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: server
          - name: frontend
            context: frontend
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/iamsarthakkr/university-management-${{ matrix.name }}:latest
            ghcr.io/iamsarthakkr/university-management-${{ matrix.name }}:${{ env.COMMIT_SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to VPS
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}
          sparse-checkout: deploy

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload deploy files
        run: scp -p -i ~/.ssh/deploy_key deploy/compose.yml deploy/deploy.sh "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"

      - name: Run deploy script
        run: ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "$VPS_APP_DIR/deploy.sh"
