name: Release

# After CI passes on main, builds and publishes an image for every app whose newest
# version in versions.yml hasn't been released yet. Deploying is manual (deploy/deploy.sh).

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  find-new-versions:
    name: Find new versions
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      new-versions: ${{ steps.find.outputs.new-versions }}
    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Find versions without a GitHub Release
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new_versions='[]'
          for app in api frontend; do
            version=$(.github/scripts/versions.sh latest "$app")
            if gh release view "${app}-v${version}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "${app} ${version} is already released"
            else
              echo "${app} ${version} will be released"
              new_versions=$(jq -c --arg app "$app" --arg version "$version" \
                '. + [{app: $app, version: $version}]' <<< "$new_versions")
            fi
          done
          echo "new-versions=${new_versions}" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ matrix.app }} ${{ matrix.version }}
    needs: find-new-versions
    if: needs.find-new-versions.outputs.new-versions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.find-new-versions.outputs.new-versions) }}
    env:
      APP: ${{ matrix.app }}
      VERSION: ${{ matrix.version }}
      IMAGE: ghcr.io/iamsarthakkr/university-management-${{ matrix.app }}:${{ matrix.version }}
    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app == 'api' && './server' || './frontend' }}
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Created last on purpose: a release only exists once its image is pushed,
      # and deploy/deploy.sh refuses versions without one.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          notes=$(yq ".${APP}[-1].notes" versions.yml)
          gh release create "${APP}-v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$COMMIT_SHA" \
            --title "${APP} ${VERSION}" --notes "${notes}

          Image: \`${IMAGE}\`"
