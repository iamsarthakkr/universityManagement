spring:
  application:
    name: universityManagementDev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/universityManagementDev}
    username: ${DB_USERNAME:university}
    password: ${DB_PASSWORD:university}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-not-for-production-use}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    email: ${ADMIN_EMAIL:admin@university.local}
  # Seeds the bundled example once into an empty dev database (all passwords are "password").
  # SEED_MODE= (blank) turns it off; apply to seed data from the seed file; rollback-dry-run / rollback remove it again.
  seed:
    mode: ${SEED_MODE:apply}
    file: ${SEED_FILE:classpath:seed/seed.example.json}
    allow-example-passwords: true
