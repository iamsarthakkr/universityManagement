spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    email: ${ADMIN_EMAIL}
  # Off unless SEED_MODE is set (apply, rollback-dry-run, rollback); see the seed section of the README
  seed:
    mode: ${SEED_MODE:}
    file: ${SEED_FILE:}
