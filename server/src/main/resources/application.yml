spring:
  application:
    name: universityManagement
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

  info:
    env:
      enabled: true

info:
  app:
    name: University Enrollment Management
    description: Backend API for university enrollment workflows
    version: '@project.version@'
# In production an override such as APP_RATE_LIMIT_LOGIN_REQUESTS must also be listed in deploy/compose.yml
app:
  rate-limit:
    enabled: true
    login:
      requests: 20
      period: 1m
    login-failures:
      requests: 10
      period: 15m
    registration:
      requests: 10
      period: 1h
    authenticated:
      requests: 120
      period: 1m
    anonymous:
      requests: 60
      period: 1m
