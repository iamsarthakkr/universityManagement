spring.application.name=universityManagementDev

# jpa settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# test db
spring.datasource.url=jdbc:mysql://localhost:3306/universityManagementTest
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# jwt config
app.jwt.secret=replace-this-with-a-long-random-secret-at-least-256-bits
app.jwt.expiration-ms=60000

# admin properties
app.admin.username=admin
app.admin.password=admin
app.admin.email=admin@gmail.com
